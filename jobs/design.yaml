# A `design` job produces one architecture/plan document — not code. The agent
# writes `docs/design/<slug>.md` arguing a decision and its tradeoffs; later
# `code`/`web` jobs depend on it and cite it. Two stages gate the markdown
# through the normal merge path:
#   stage 0 — an agent reviewer (tasks/review-design.md) judges whether the doc
#             addresses the brief, weighs alternatives honestly, and stays
#             consistent with spec.md and the codebase as they exist.
#   stage 1 — the shared doc lint (tasks/doc-lint.sh: markdown well-formedness,
#             intra-repo link resolution, best-effort code-path existence) runs
#             alongside the appended project `ci` default (jobs/_defaults.yaml).
#             `ci` self-skips a doc-only diff in seconds via its tasks/ci.sh glob
#             matcher (no crates/** change → no cargo build), so stage 1 is cheap.
# No cargo build is ever needed here, so resources are modest.
name: design
display_name: Design
description: Produce an architecture/plan document under docs/design/; agent-reviewed, doc-lint gated.
image: chuggernaut/agent-rust:prod
work:
  type: agent
  prompt: prompts/work/design.md
eval:
  - name: review-design
    type: agent
    prompt: tasks/review-design.md
    stage: 0
  # Shared with jobs/docs.yaml. Image falls back to the top-level image.
  - name: doc-lint
    type: command
    run: ./tasks/doc-lint.sh
    stage: 1
resources:
  cpu: 1
  memory: 1Gi
  # Reading + writing prose, an agent review, and two fast shell checks — no
  # workspace build. Nowhere near the code job's Rust hour.
  task_timeout: 30m
work_retries: 1
eval_retries: 1
rework_budget: 2
