# Swap the served static UI for the one on current main — the fast half of the
# web iteration loop (jobs/web.yaml). A publish job carries no commits:
# releasing it from main builds web/dist at HEAD and rsyncs it into the host
# directory the api container serves (UI_ROOT mount, deploy/prod/README §7).
# Refresh the page, see the new front end — no image rebuild, no restarts.
# Release it manually after a web job lands, like deploy but ~30s.
name: web-publish
display_name: Publish Web UI
description: Build web/dist at current main and swap it into the served UI dir on the Mini. External effect; branch is scratch.
image: chuggernaut/agent-rust:prod   # node 22 + ssh + git
work:
  type: command
  run: ./tasks/web-publish.sh
  # Same key as deploy (spec §8.2): the private-key VALUE, written to a 0600
  # tempfile for ssh -i by the script.
  secrets: [MINI_DEPLOY_KEY]
wrap_up:
  type: none                        # external effect; nothing to merge
resources:
  cpu: 2
  memory: 2Gi
  task_timeout: 10m
