# Chuggernaut-on-Chuggernaut: a coding agent implements the ticket inside the
# Rust workspace, an inline reviewer (fresh session each round, spec §4.5)
# pushes back before submit, and the project-wide CI gate in
# jobs/_defaults.yaml judges the result.
name: code
display_name: Code
description: Implement the job ticket in the chuggernaut Rust workspace; inline review, CI-gated.
image: chuggernaut/agent-rust:prod
# Injected into every work container's system prompt (spec §4.4): the
# distilled STYLE.md / NORTH-STAR.md rules that keep agent output consistent.
knowledge:
  - north-star-blessed-practices
work:
  type: agent
  prompt: prompts/work/code.md
  review:
    prompt: prompts/review/code.md
    iterations: 3
# Staged evaluation (spec §3.3): an authoritative agentic review gates the CI
# command evaluator. CI on this project is a cold cargo build — slow, and it
# loads the shared Docker host — so there is no point spending it on a change
# the reviewer will reject. Review runs in stage 0; the appended `ci` default
# (jobs/_defaults.yaml) is stage 1 and only runs if review passes.
eval:
  - name: review
    type: agent
    prompt: tasks/review-code.md
    stage: 0
resources:
  cpu: 3
  memory: 5Gi
  # Covers the whole inline loop — all author/review iterations in one
  # container — plus a cold cargo build of the workspace.
  task_timeout: 1h
work_retries: 1
eval_retries: 1
rework_budget: 2
