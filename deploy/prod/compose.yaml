# Prod stack: operator-mode NATS and the SSH front, pointed at the external data
# dir (${KEYS_DIR}/${REPOS_ROOT}) with a fixed project name so the network is
# predictable (chuggernaut_default). The DISPATCHER and the api both run on the
# host under launchd (the dispatcher needs the Docker socket and the repos
# filesystem; the api is the same binary the host already builds every deploy,
# so containerizing it only forced a redundant in-VM cargo compile — see README
# §2). Host services reach NATS on the published :4222.
#
# All ${VARS} are substituted from the environment — boot.sh sources
# deploy/prod/chuggernaut.env (set -a) before invoking compose.
name: chuggernaut

services:
  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: ["-c", "/keys/nats-resolver.conf", "-js", "-sd", "/data"]
    ports:
      - "4222:4222"
    volumes:
      - ${KEYS_DIR}:/keys:ro
      - nats-data:/data

  ssh:
    build:
      context: ../..
      dockerfile: deploy/dev/Dockerfile.ssh
      args:
        # Match the host uid that owns the bind-mounted bare repos so the
        # container's git user can write them (Colima maps host uid through).
        GIT_UID: ${GIT_UID:-501}
    image: chuggernaut/ssh:${CHUG_IMAGE_TAG:-prod}
    restart: unless-stopped
    ports:
      - "2222:22"
    volumes:
      - ${REPOS_ROOT}:/data/repos
      - ${KEYS_DIR}/ssh_ca.pub:/etc/chuggernaut/ssh_ca.pub:ro
      - ssh-hostkeys:/etc/ssh/hostkeys

volumes:
  nats-data:
  ssh-hostkeys:
