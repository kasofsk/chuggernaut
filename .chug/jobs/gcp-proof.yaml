# The workload-identity proof — design #313 half A, slice S6, on demand.
# Releasing it climbs .chug/tasks/gcp-proof.sh's five-rung ladder against
# chuggernaut's OWN GCP project (infra/gcp-proof), and reports. It is a report,
# not a change: nothing merges.
#
# It is deliberately NOT in .chug/jobs/_defaults.yaml and not wired into any
# gate — the same shape as android-proof.yaml and coverage.yaml, for the same
# reason. The question it answers ("is the federated credential bounded") is one
# you ask after touching the terraform, the issuer or the injection path, not on
# every push.
#
# THIS IS THE ONLY JOB TYPE THAT MAY DECLARE `workload_identities:`. Half A is
# being proven, not adopted; a second declaration belongs to the job that needs
# it, with its own binding.
#
# The deliverable is the task's STDOUT. The dispatcher harvests a command work
# task's container logs into its `stdout.log` artifact (spec §3.2) and a worker
# keeps only the final 700 KiB, so the script prints its LADDER summary last, on
# the failing path as much as the passing one.
name: gcp-proof
display_name: GCP workload-identity proof
description: Climb the #313 half-A ladder against chuggernaut's own GCP project. A report, not a change; nothing is merged.
# Epoch 5 is required by the non-empty `workload_identities:` below (spec §1.1).
# It is enforced twice, at different moments: .chug/tasks/ci.sh's config-skew
# gate at merge, and the running dispatcher at release (spec §14.2), where a
# pre-epoch-5 dispatcher parks the job `config_schema_skew` and launches
# nothing. A deploy carrying epoch 5 is the real prerequisite — infra/README.md §2.
min_dispatcher: 5
# gcloud is what rungs 3-5 drive. Rung 3 reports NOT REACHED rather than a false
# PASS if the image has no gcloud, so a wrong image here is legible.
image: chuggernaut/agent:prod
work:
  # A command, not an agent: there is nothing to author, only something to
  # demonstrate. The script's stdout is the report.
  type: command
  run: ./.chug/tasks/gcp-proof.sh
  # The whole subject of the proof. One identity, granted to `work` alone — an
  # evaluator's token would carry `container: eval:<name>` and match no binding
  # in infra/gcp-proof, which is what rung 5b exists to demonstrate.
  workload_identities: [gcp-proof]
eval:
  # Rung 5b, and the reason it is a separate container: the property under test
  # is NON-INHERITANCE (#313 A5), and a container that was granted an identity
  # cannot test that a container without one gets nothing. THE ABSENCE OF
  # `workload_identities:` ON THIS ENTRY IS THE ASSERTION — do not add one.
  - name: no-identity
    type: command
    image: chuggernaut/agent:prod
    run: ./.chug/tasks/gcp-proof-negative.sh
    stage: 0
  # The appended project ci default (.chug/jobs/_defaults.yaml) stays at stage 1
  # and runs only once this passes. A proof job carries no commits, so ci sees an
  # empty diff and glob-skips its cargo build in seconds.
inputs:
  # The two buckets from `terraform output`. They are inputs rather than
  # constants because bucket names are globally unique, so a re-apply under a
  # different `bucket_prefix` must not need a config commit. Defaults match
  # infra/gcp-proof/variables.tf's own defaults.
  - name: granted_bucket
    type: string
    default: chug-wif-proof-granted
    description: Bucket the proof's service account MAY read (terraform output granted_bucket).
  - name: denied_bucket
    type: string
    default: chug-wif-proof-denied
    description: Bucket it must be REFUSED (terraform output denied_bucket). Holds a canary, so a refusal is a 403 and not a 404.
wrap_up:
  # A proof produces a report, not a change: the branch carries no commits, so
  # eval-pass goes straight to Done with the branch discarded (spec §3.3 step
  # 12). android-proof.yaml's shape, and coverage.yaml's before it.
  type: none
resources:
  # Reading two small objects over HTTPS. Every wait in the ladder is bounded
  # well inside this, so a hung exchange fails its rung by name instead of being
  # killed here.
  cpu: 1
  memory: 512Mi
  task_timeout: 15m
# rework_budget is omitted because it is DISALLOWED for work.type: command (spec
# §1.1 field-rules table). work_retries stays at its default 0: a failed proof is
# a finding, and re-running it automatically would spend another exchange to
# learn the same thing.
