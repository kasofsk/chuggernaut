# A `design` job produces one architecture/plan document — not code. The agent
# writes `docs/design/{seq}-{slug}.md` arguing a decision and its tradeoffs; later
# `code`/`web` jobs depend on it and cite it. Two stages gate the markdown
# through the normal merge path:
#   stage 0 — an agent reviewer (.chug/tasks/review-design.md) judges whether the doc
#             addresses the brief, weighs alternatives honestly, and stays
#             consistent with docs/spec.md and the codebase as they exist.
#   stage 1 — the shared doc lint (.chug/tasks/doc-lint.sh: markdown well-formedness,
#             intra-repo link resolution, and the docs/design/{seq}-{slug}.md
#             filename shape) runs alongside the appended project `ci` default
#             (.chug/jobs/_defaults.yaml). The path and constant claims a doc makes
#             are not lint's job: .chug/tasks/check-doc-facts.sh gates those in that
#             default's pure-shell pre-stage, whole-tree and on every job type.
#             `ci` self-skips a doc-only diff in seconds via its .chug/tasks/ci.sh glob
#             matcher (no crates/** change → no cargo build), so stage 1 is cheap.
# No cargo build is ever needed here, so resources are modest.
name: design
display_name: Design
description: Produce an architecture/plan document under docs/design/; agent-reviewed, doc-lint gated.
image: chuggernaut/agent-rust:prod
# Injected into every work container's system prompt (spec §4.4): the pages
# that define this repo's blessed practices, delivered as themselves. Payload,
# not a pointer, and not a distillation — a second copy of a rule is what
# drifts (design #415 D4).
knowledge:
  - docs/reference/style.md
  - docs/README.md
work:
  type: agent
  prompt: .chug/prompts/work/design.md
eval:
  - name: review-design
    type: agent
    prompt: .chug/tasks/review-design.md
    stage: 0
  # Shared with .chug/jobs/docs.yaml. Image falls back to the top-level image.
  - name: doc-lint
    type: command
    run: ./.chug/tasks/doc-lint.sh
    stage: 1
resources:
  cpu: 1
  memory: 1Gi
  # Reading + writing prose, an agent review, and two fast shell checks — no
  # workspace build. Nowhere near the code job's Rust hour.
  task_timeout: 30m
work_retries: 1
eval_retries: 1
rework_budget: 2
