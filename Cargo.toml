[workspace]
resolver = "2"
members = [
    "crates/types",
    "crates/store",
    "crates/auth",
    "crates/container",
    "crates/worker",
    "crates/agent",
    "crates/vcs",
    "crates/dispatcher",
    "crates/api",
    "crates/webhooks",
    "crates/cli",
    "crates/chuggernaut",
    "crates/chuggernaut-channel",
    "crates/chuggernaut-harness",
    "crates/chuggernaut-ko",
    "crates/test-utils",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# internal
types = { path = "crates/types" }
store = { path = "crates/store" }
auth = { path = "crates/auth" }
container = { path = "crates/container" }
worker = { path = "crates/worker" }
agent = { path = "crates/agent" }
vcs = { path = "crates/vcs" }
dispatcher = { path = "crates/dispatcher" }
api = { path = "crates/api" }
webhooks = { path = "crates/webhooks" }
cli = { path = "crates/cli" }
test-utils = { path = "crates/test-utils" }

# external
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["full"] }
async-nats = "0.38"
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
petgraph = "0.7"
jsonwebtoken = "9"
argon2 = "0.5"
nkeys = "0.4"
sha2 = "0.10"
data-encoding = "2"
age = "0.11"
flate2 = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
futures = "0.3"
tower = { version = "0.5", features = ["util"] }
testcontainers = "=0.26.3"
