[package]
name = "chuggernaut-platform-ops"
version.workspace = true
edition.workspace = true
license.workspace = true

# The platform-ops bounded context (NORTH-STAR §1, refactor-plan C8/C9). It is
# a leaf of the crate graph: it depends on the ports it drives (`container`,
# `store`, `vcs`, `agent`) and never on `dispatcher`, so the dependency arrow
# between the context and the lifecycle loop points one way only. The
# dependency-boundary guard in `test-utils/tests/boundary_guard.rs`
# machine-checks that edge list.
[dependencies]
types.workspace = true
store.workspace = true
vcs.workspace = true
container.workspace = true
agent.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Tests only: the capacity-provenance cases need a concrete
# `DateTime<Utc>` to stamp `ObservedCapacity::observed_at` with. Already a
# workspace dependency (`types` exposes the type in its public API); nothing in
# this crate's own code takes a clock.
[dev-dependencies]
chrono.workspace = true
# Tests only: the transcript-resolution cases (design #490 slice 1) drive the
# harvest against the workspace's own scriptable `ContainerBackend` fake rather
# than a second copy of one, and need a runtime to await it on. Both are
# workspace dependencies already, and `test-utils` reaches no crate this one's
# charter forbids (`boundary_guard.rs`).
test-utils.workspace = true
tokio.workspace = true

[lints]
workspace = true
