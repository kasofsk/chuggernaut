steps:
- event: create+release → eval (main moves) → gate → promote
  transitions:
  - job: 1
    from: Frozen
    to: Ready
  - job: 1
    from: Ready
    to: Work
  - job: 1
    from: Work
    to: Evaluation
  - job: 1
    from: Evaluation
    to: WrapUp
  - job: 1
    from: WrapUp
    to: Done
  effects:
  - PublishEvent job-created
  - PublishEvent job-released
  - PublishEvent job-started
  - PublishEvent task-created
  - PublishEvent task-completed
  - PublishEvent job-evaluation-started
  - PublishEvent task-created
  - PublishEvent task-completed
  - PublishEvent job-wrapup-started
  - CreateSquashCandidate
  - PublishEvent job-merge-gate-started
  - LaunchGateStage
  - PublishEvent task-created
  - PublishEvent task-completed
  - AdvanceDefault
  - DeleteBranch merge-gate/1
  - PublishEvent job-done
