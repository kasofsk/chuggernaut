name: Deploy

# Auto-deploy to the Mac Mini on every push to main. Runs on the Mini's
# self-hosted runner (Kasofsk org), targeted by the dedicated `chug`
# label so no other org runner can pick it up. See deploy/prod/README.md.
#
# There is no GitHub-side CI: fmt/clippy/test run on the Chuggernaut
# platform itself (the `ci` evaluator gates every job before its work can
# merge to integration and ship as a release PR), so a commit reaching main
# has already passed them. Never trigger on pull_request — with a
# self-hosted runner that would run fork PR code on the Mini.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, chug]
    concurrency:
      group: deploy-mini
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Build the target commit and restart services
        run: deploy/prod/update.sh "${{ github.sha }}"
