name: Deploy

# Auto-deploy to the Mac Mini after CI passes on main. Runs on the Mini's
# self-hosted runner (Kasofsk org), targeted by the dedicated `chug`
# label so no other org runner can pick it up. See deploy/prod/README.md.
#
# Triggering on workflow_run (not push) means only commits that passed
# fmt/clippy/test deploy. Never trigger on pull_request — with a self-hosted
# runner that would run fork PR code on the Mini.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, chug]
    concurrency:
      group: deploy-mini
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Build the target commit and restart services
        run: deploy/prod/update.sh "${{ github.event.workflow_run.head_sha }}"
