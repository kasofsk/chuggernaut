[package]
name = "types"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
chrono.workspace = true
thiserror.workspace = true
schemars = { workspace = true, optional = true }

[features]
# JSON Schema derivation for the repo-authored YAML types (job types, eval
# packs). Off by default so the schema machinery stays out of the runtime
# crates; the CLI turns it on for `chuggernaut schema`.
schema = ["dep:schemars"]
